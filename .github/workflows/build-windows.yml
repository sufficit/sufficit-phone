name: Build Windows (NSIS)

on:
  push:
    branches: [main]
    paths: ['Linphone/**', 'cmake/**', 'external/**', 'CMakeLists.txt', '.github/workflows/build-windows.yml']
  pull_request:
    paths: ['Linphone/**', 'cmake/**', 'external/**', 'CMakeLists.txt', '.github/workflows/build-windows.yml']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nsis:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Restore submodules (offline bundle)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          key="${{ vars.SUBMODS_BUNDLE_KEY }}"
          sha="${{ vars.SUBMODS_BUNDLE_SHA256 }}"
          if [ -z "$key" ] || [ -z "$sha" ]; then
            echo "SUBMODS_BUNDLE_KEY/SUBMODS_BUNDLE_SHA256 não definidas (veja .github/workflows/README.md)."
            exit 1
          fi
          tag="submods-${key:0:8}"
          echo "Baixando bundle $tag..."
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "submodules-${key}.tar.gz" --output /tmp/submodules.tar.gz
          echo "$sha  /tmp/submodules.tar.gz" | sha256sum -c -
          tar -xzf /tmp/submodules.tar.gz
          test -f external/linphone-sdk/CMakeLists.txt
          echo "Submódulos restaurados (offline)."

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # O feed community.chocolatey.org devolve 503/504 às vezes; o choco
          # pode ainda sair com exit 0 sem instalar tudo, então a verificação
          # de presença dos .exe é quem decide se precisa tentar de novo.
          $depsOk = $false
          foreach ($try in 1..3) {
            if ($try -gt 1) {
              Write-Host "Ferramentas pendentes após a tentativa $($try - 1); aguardando antes de tentar de novo..."
              Start-Sleep -Seconds (60 * ($try - 1))
            }
            Write-Host "choco install doxygen/nasm/yasm (tentativa $try de 3)..."
            choco install doxygen.install nasm yasm -y --no-progress
            $doxygen = $null
            foreach ($d in @('C:\Program Files\doxygen', 'C:\Program Files (x86)\doxygen')) {
              if (Test-Path "$d\doxygen.exe") { $doxygen = Get-Item "$d\doxygen.exe"; break }
            }
            if (-not $doxygen) {
              $doxygen = Get-ChildItem 'C:\Program Files' -Filter doxygen.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            $nasm = Get-ChildItem 'C:\Program Files (x86)\NASM', 'C:\Program Files\NASM' -Filter nasm.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $nasm) { $nasm = Get-ChildItem 'C:\ProgramData\chocolatey\bin' -Filter nasm.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
            # yasm: exigido por CheckBuildToolsCommon quando ENABLE_VPX/ENABLE_AV1
            $yasm = (Get-Command yasm.exe -ErrorAction SilentlyContinue).Source
            if (-not $yasm) {
              foreach ($root in @('C:\Program Files (x86)\yasm', 'C:\Program Files\yasm', 'C:\tools\yasm')) {
                if ($root -and (Test-Path $root)) {
                  $yasm = Get-ChildItem $root -Filter yasm.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
                  if ($yasm) { break }
                }
              }
            }
            if ($doxygen -and $nasm -and $yasm) { $depsOk = $true; break }
            Write-Host "Ainda faltam: doxygen=$([bool]$doxygen) nasm=$([bool]$nasm) yasm=$([bool]$yasm)"
          }
          if (-not $depsOk) { throw 'doxygen/nasm/yasm não instalados após 3 tentativas (feed community.chocolatey.org indisponível?)' }
          $doxygen.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $nasm.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Split-Path $yasm -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          python -m pip install --user pystache six cython pdoc meson ninja
          python -c 'import pystache, six; print("Python modules OK:", pystache.__file__)'
          # find_package(Python3) no Configure pode escolher um interpretador
          # diferente do "python" usado aqui (hostedtoolcache tem várias
          # versões); pystache/six são Python puro, então basta expor o
          # site-packages via PYTHONPATH para qualquer interpretador achar.
          $site = (python -c "import site; print(site.getusersitepackages())")
          "PYTHONPATH=$site" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PYTHONPATH=$site"
          # meson/ninja: exigidos pelo CheckBuildToolsCommon do linphone-sdk
          # (com ENABLE_VPX/AV1 ativos). O pip --user coloca meson.exe/ninja.exe
          # no diretorio de scripts do usuario, fora do PATH padrao do runner.
          $userScripts = (python -c "import sysconfig; print(sysconfig.get_path('scripts', 'nt_user'))")
          $userScripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "GITHUB_PATH += $userScripts"
          $env:PATH = "$userScripts;$env:PATH"
          meson --version
          ninja --version
          # nasm/yasm do choco vivem em "C:\Program Files (x86)\..." (com
          # espacos). Os makefiles do openh264/vpx expandem o assembler sem
          # aspas, entao caminho com espaco quebra a regra ("/usr/bin/sh:
          # C:/Program: No such file or directory"). Copiamos os .exe para um
          # diretorio sem espacos, que o Configure/Build poem na frente do PATH.
          New-Item -ItemType Directory -Force C:\ci-bin | Out-Null
          Copy-Item $nasm.FullName C:\ci-bin\nasm.exe -Force
          Copy-Item $yasm C:\ci-bin\yasm.exe -Force
          # O link.exe do GNU coreutils (Git\usr\bin e MSYS2) sombreia o
          # link.exe da MSVC nos EPs que resolvem pelo PATH; o meson do dav1d
          # aborta com "Found GNU link.exe instead of MSVC link.exe" mesmo
          # com msvc-dev-cmd (a rodada 10 provou que a ordem do PATH no
          # ambiente do MSBuild nao e a do passo). Renomear elimina o
          # candidato: o unico link.exe resolvivel passa a ser o da MSVC.
          foreach ($dir in @("$env:ProgramFiles\Git\usr\bin", "$env:ProgramFiles\Git\mingw64\bin", 'C:\msys64\usr\bin', 'C:\msys64\mingw64\bin')) {
            $gnuLink = Join-Path $dir 'link.exe'
            if (Test-Path $gnuLink) {
              Rename-Item $gnuLink 'link.exe.gnu-coreutils.bak'
              Write-Host "Renomeado $gnuLink -> link.exe.gnu-coreutils.bak"
            }
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsisOk = $false
          foreach ($try in 1..3) {
            if ($try -gt 1) {
              Write-Host "NSIS ausente após a tentativa $($try - 1); aguardando..."
              Start-Sleep -Seconds (60 * ($try - 1))
            }
            choco install nsis -y --no-progress
            if (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe') { $nsisOk = $true; break }
          }
          if (-not $nsisOk) { throw 'makensis.exe não encontrado após 3 tentativas do choco' }
          $nsis = Get-ChildItem 'C:\Program Files (x86)' -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { throw 'makensis.exe não encontrado após a instalação' }
          $nsis.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtnetworkauth qtshadertools'
          cache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          # C:\ci-bin primeiro: o find_program(NASM_PROGRAM) do openh264
          # captura o caminho do assembler no Configure e ele nao pode ter
          # espacos (ver bloco no passo de dependencias).
          $env:Path = "C:\ci-bin;C:\Program Files (x86)\NSIS;$env:Path"
          # O pwsh do runner deixa no PSModulePath herdado os diretórios do
          # PowerShell 7 - incluindo um Microsoft.PowerShell.Utility que
          # declara edição apenas "Core"; o powershell.exe 5.1 que o SDK
          # invoca via execute_process (external/rnnoise valida o checksum
          # do modelo com Get-FileHash) resolve esse módulo primeiro, não
          # consegue carregá-lo e o checksum volta vazio ("Checksums do not
          # match" - a rodada 7 falhou mesmo com o diretório do 5.1 anexado
          # ao fim do PSModulePath). Substituir a variável pelo diretório
          # nativo do 5.1 garante que o processo filho resolva apenas os
          # módulos do Windows PowerShell.
          $env:PSModulePath = "$env:windir\System32\WindowsPowerShell\v1.0\Modules"
          Write-Host "PSModulePath (filhos) = $env:PSModulePath"
          # Falha rápida e clara (antes do cmake) se o 5.1 não resolver Get-FileHash.
          powershell -NoProfile -Command "exit [int](-not (Get-Command Get-FileHash -ErrorAction SilentlyContinue))"
          if ($LASTEXITCODE -ne 0) { throw 'Get-FileHash indisponível no powershell.exe 5.1 (PSModulePath incorreto?)' }

          # Os EPs do linphone-sdk que invocam ferramentas fora do MSBuild
          # (dav1d via meson; libvpx e openh264 via scripts) resolvem o
          # link.exe pelo PATH. Sem o ambiente do VS (vcvars), o link.exe
          # do GNU em Git\usr\bin sombreia o da MSVC e o meson aborta o
          # dav1d com "Found GNU link.exe instead of MSVC link.exe".
          # msvc-dev-cmd acima prepende as ferramentas da MSVC ao PATH;
          # aqui falhamos rápido se algo desfizer isso.
          $link = (where.exe link.exe 2>$null | Select-Object -First 1)
          Write-Host "link.exe (PATH) = $link"
          if (-not $link -or $link -notlike '*Microsoft Visual Studio*') { throw "link.exe inesperado no PATH: $link (msvc-dev-cmd não aplicado?)" }
          # ENABLE_CRASH_HANDLER=OFF: com o crash handler ligado no Windows
          # o Configure executa gclient.bat (chromium-depot-tools) e gn para
          # compilar o crashpad - submódulos propositalmente vazios no bundle
          # offline (ver README). Em macOS/Linux o bloco é WIN32-only e o
          # alvo Crashpad nunca é criado; OFF equipara o Windows a eles
          # (HAVE_CRASH_HANDLER fica indefinido e o app compila sem crashpad).
          cmake -S . -B build-desktop -G "Visual Studio 17 2022" -A x64 `
            -DLINPHONESDK_PLATFORM=Desktop `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DENABLE_APP_PACKAGING=ON `
            -DENABLE_CRASH_HANDLER=OFF

      - name: Build and package
        shell: pwsh
        run: |
          # Ferramentas MSYS/Git para a cadeia dos EPs (MSBuild -> cmd -> sh):
          # bash/sh/make precisam resolver antes do System32, senao o stub do
          # WSL (C:\Windows\System32\bash.exe) captura scripts com shebang
          # '#!/bin/bash' - foi assim que o gen_msvs_def.sh do vpx morreu com
          # 'Windows Subsystem for Linux has no installed distributions'.
          # O link.exe do GNU ja foi renomeado no passo de dependencias; com
          # isso o unico link.exe no PATH e o da MSVC (msvc-dev-cmd) e o
          # meson do dav1d passa no sanity check de linkagem.
          $env:Path = "C:\ci-bin;C:\Program Files\Git\usr\bin;C:\msys64\usr\bin;$env:Path"
          foreach ($t in @('link.exe','bash.exe','sh.exe','make.exe','nasm.exe','yasm.exe')) {
            $hit = (where.exe $t 2>$null | Select-Object -First 1)
            Write-Host "$t -> $hit"
          }
          $link = (where.exe link.exe 2>$null | Select-Object -First 1)
          if (-not $link -or $link -notlike '*Microsoft Visual Studio*') { throw "link.exe inesperado no PATH do build: $link" }
          $bash = (where.exe bash.exe 2>$null | Select-Object -First 1)
          if (-not $bash -or $bash -like '*System32\bash.exe') { throw "bash.exe inesperado no PATH do build: $bash (stub do WSL?)" }
          cmake --build build-desktop --config RelWithDebInfo --target install --parallel $env:NUMBER_OF_PROCESSORS

      - name: Collect artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem 'build-desktop/OUTPUT/Packages' -Filter *.exe | Select-Object -First 1
          if (-not $exe) { Get-ChildItem 'build-desktop/OUTPUT' -Recurse -File | Select-Object -First 50 -ExpandProperty FullName; throw 'installer .exe not found' }
          Copy-Item $exe.FullName "dist/sufficit-phone-win64.exe"
          $hash = (Get-FileHash "dist/sufficit-phone-win64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  sufficit-phone-win64.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: sufficit-phone-windows
          path: dist/*
          if-no-files-found: error
