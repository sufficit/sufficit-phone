name: Build macOS (DMG)

on:
  push:
    branches: [main]
    paths: ['Linphone/**', 'cmake/**', 'external/**', 'CMakeLists.txt', '.github/workflows/build-macos.yml']
  pull_request:
    paths: ['Linphone/**', 'cmake/**', 'external/**', 'CMakeLists.txt', '.github/workflows/build-macos.yml']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_BREAK_SYSTEM_PACKAGES: '1'

jobs:
  dmg:
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Restore submodules (offline bundle)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          key="${{ vars.SUBMODS_BUNDLE_KEY }}"
          sha="${{ vars.SUBMODS_BUNDLE_SHA256 }}"
          if [ -z "$key" ] || [ -z "$sha" ]; then
            echo "SUBMODS_BUNDLE_KEY/SUBMODS_BUNDLE_SHA256 não definidas (veja .github/workflows/README.md)."
            exit 1
          fi
          tag="submods-${key:0:8}"
          echo "Baixando bundle $tag..."
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "submodules-${key}.tar.gz" --output /tmp/submodules.tar.gz
          echo "$sha  /tmp/submodules.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/submodules.tar.gz
          test -f external/linphone-sdk/CMakeLists.txt
          echo "Submódulos restaurados (offline)."

      - name: Install build dependencies
        run: |
          brew install doxygen graphviz nasm yasm meson ninja
          python3 -m pip install --break-system-packages pystache six cython pdoc
          # O generate do app roda CMake com o Python do hostedtoolcache; exporta
          # PYTHONPATH para que qualquer interpretador encontre os módulos.
          SITE=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          echo "PYTHONPATH=$SITE" >> "$GITHUB_ENV"
          echo "site-packages: $SITE"
          # macOS não tem "sha256sum" (só shasum -a 256), mas o CMake do
          # external/rnnoise chama "sha256sum" incondicionalmente fora do
          # Windows; sem checar o RESULT_VARIABLE, "command not found" deixa o
          # checksum vazio e o build falha com "Checksums do not match".
          if ! command -v sha256sum >/dev/null 2>&1; then
            BREW_BIN=$(dirname "$(command -v brew)")
            printf '#!/bin/sh\nexec shasum -a 256 "$@"\n' > "$BREW_BIN/sha256sum"
            chmod +x "$BREW_BIN/sha256sum"
            echo "sha256sum ausente; wrapper instalado em $BREW_BIN/sha256sum"
          fi
          echo teste | sha256sum >/dev/null && echo "sha256sum OK: $(command -v sha256sum)"

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtmultimedia qtnetworkauth qtshadertools'
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.3 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_APP_PACKAGING=ON \
            -DENABLE_PQCRYPTO=OFF \
            -DLINPHONEAPP_APPLICATION_NAME=SufficitPhone
          # "SufficitPhone" (sem espaço) é obrigatório: o Makefile do libvpx não
          # cita caminhos, então "Sufficit Phone.app/Contents/Frameworks" quebra
          # a regra de instalação ("No rule to make target 'Phone.app/...'").

      - name: Build and package
        run: cmake --build build --target install --parallel "$(sysctl -n hw.ncpu)"

      - name: Collect artifact
        run: |
          set -e
          mkdir -p dist
          f=$(find build/OUTPUT/Packages -name '*.dmg' | head -n1)
          if [ -z "$f" ]; then echo "DMG not found"; find build/OUTPUT -maxdepth 3 -type f | head -50; exit 1; fi
          cp "$f" "dist/sufficit-phone-macos.dmg"
          (cd dist && shasum -a 256 -- * > SHA256SUMS)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: sufficit-phone-macos
          path: dist/*
          if-no-files-found: error
