name: Build macOS (DMG)

on:
  push:
    branches: [main]
    paths: ['Linphone/**', 'cmake/**', 'external/**', 'CMakeLists.txt', '.github/workflows/build-macos.yml']
  pull_request:
    paths: ['Linphone/**', 'cmake/**', 'external/**', 'CMakeLists.txt', '.github/workflows/build-macos.yml']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_BREAK_SYSTEM_PACKAGES: '1'

jobs:
  dmg:
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Fetch submodules (with retries)
        shell: bash
        run: |
          set -e
          for i in 1 2 3 4 5; do
            echo "Tentativa $i de fetch dos submódulos..."
            if git submodule sync --recursive && git submodule update --init --recursive --jobs 4; then
              echo "Submódulos OK na tentativa $i"
              exit 0
            fi
            echo "Falhou; aguardando 30s antes de retry"
            sleep 30
          done
          echo "gitlab.linphone.org inacessível após 5 tentativas"
          exit 1

      - name: Install build dependencies
        run: |
          brew install nasm yasm
          pip3 install --break-system-packages pystache six

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtmultimedia qtnetworkauth qtshadertools'
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.3 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_APP_PACKAGING=ON \
            -DENABLE_PQCRYPTO=OFF

      - name: Build and package
        run: cmake --build build --target install --parallel "$(sysctl -n hw.ncpu)"

      - name: Collect artifact
        run: |
          set -e
          mkdir -p dist
          f=$(find build/OUTPUT/Packages -name '*.dmg' | head -n1)
          if [ -z "$f" ]; then echo "DMG not found"; find build/OUTPUT -maxdepth 3 -type f | head -50; exit 1; fi
          cp "$f" "dist/sufficit-phone-macos.dmg"
          (cd dist && shasum -a 256 -- * > SHA256SUMS)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: sufficit-phone-macos
          path: dist/*
          if-no-files-found: error
