# Builds the linphone-sdk for iOS Simulator (xcframework) — the library a
# future iOS app of Sufficit Phone will consume. Device builds require an
# Apple signing identity; add a signed preset/job when that is available.
name: Build iOS SDK (Simulator)

on:
  push:
    branches: [main]
    paths: ['external/linphone-sdk', '.github/workflows/build-ios.yml']
  pull_request:
    paths: ['external/linphone-sdk', '.github/workflows/build-ios.yml']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcframework:
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Restore submodules (offline bundle)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          key="${{ vars.SUBMODS_BUNDLE_KEY }}"
          sha="${{ vars.SUBMODS_BUNDLE_SHA256 }}"
          if [ -z "$key" ] || [ -z "$sha" ]; then
            echo "SUBMODS_BUNDLE_KEY/SUBMODS_BUNDLE_SHA256 não definidas (veja .github/workflows/README.md)."
            exit 1
          fi
          tag="submods-${key:0:8}"
          echo "Baixando bundle $tag..."
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "submodules-${key}.tar.gz" --output /tmp/submodules.tar.gz
          echo "$sha  /tmp/submodules.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/submodules.tar.gz
          test -f external/linphone-sdk/CMakeLists.txt
          echo "Submódulos restaurados (offline)."

      - name: Install build dependencies
        run: |
          brew install doxygen graphviz nasm yasm meson ninja
          python3 -m pip install --break-system-packages pystache six cython pdoc
          python3 -c 'import pystache, six; print("Python modules OK:", pystache.__file__)'

      - name: Configure SDK (ios-arm64-simulator)
        run: cmake -S external/linphone-sdk -B build-ios --preset ios-arm64-simulator

      - name: Build SDK (ios-arm64-simulator)
        run: cmake --build build-ios --parallel "$(sysctl -n hw.ncpu)"

      - name: Collect artifact
        run: |
          set -e
          mkdir -p dist
          found=0
          while IFS= read -r -d '' f; do
            base=$(basename "$f")
            cp "$f" "dist/$base"
            found=1
          done < <(find build-ios \( -name 'linphone-sdk*.zip' -o -name '*.xcframework' \) -maxdepth 6 -print0 2>/dev/null)
          if [ "$found" -eq 0 ]; then echo "SDK output not found"; find build-ios -maxdepth 5 -type d -name '*sdk*' | head -50; exit 1; fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: sufficit-phone-ios-sdk-simulator
          path: dist/*
          if-no-files-found: error
