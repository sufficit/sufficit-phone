# Builds the linphone-sdk for iOS Simulator (xcframework/frameworks) — the
# library a future iOS app of Sufficit Phone will consume. Device builds
# require an Apple signing identity; add a signed preset/job when available.
name: Build iOS SDK (Simulator)

on:
  push:
    branches: [main]
    paths: ['external/linphone-sdk', '.github/workflows/build-ios.yml']
  pull_request:
    paths: ['external/linphone-sdk', '.github/workflows/build-ios.yml']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcframework:
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Restore submodules (offline bundle)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          key="${{ vars.SUBMODS_BUNDLE_KEY }}"
          sha="${{ vars.SUBMODS_BUNDLE_SHA256 }}"
          if [ -z "$key" ] || [ -z "$sha" ]; then
            echo "SUBMODS_BUNDLE_KEY/SUBMODS_BUNDLE_SHA256 não definidas (veja .github/workflows/README.md)."
            exit 1
          fi
          tag="submods-${key:0:8}"
          echo "Baixando bundle $tag..."
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "submodules-${key}.tar.gz" --output /tmp/submodules.tar.gz
          echo "$sha  /tmp/submodules.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/submodules.tar.gz
          test -f external/linphone-sdk/CMakeLists.txt
          echo "Submódulos restaurados (offline)."

      - name: Install build dependencies
        run: |
          brew install doxygen graphviz nasm yasm meson ninja
          python3 -m pip install --break-system-packages pystache six cython pdoc
          # macOS não tem "sha256sum" (só shasum -a 256), mas partes do SDK
          # (ex.: external/rnnoise) chamam "sha256sum" direto; sem o wrapper,
          # "command not found" vira checksum vazio e o configure falha.
          if ! command -v sha256sum >/dev/null 2>&1; then
            BREW_BIN=$(dirname "$(command -v brew)")
            printf '#!/bin/sh\nexec shasum -a 256 "$@"\n' > "$BREW_BIN/sha256sum"
            chmod +x "$BREW_BIN/sha256sum"
            echo "sha256sum ausente; wrapper instalado em $BREW_BIN/sha256sum"
          fi
          echo teste | sha256sum >/dev/null && echo "sha256sum OK: $(command -v sha256sum)"

      - name: Configure SDK (packager, simulator)
        run: |
          cmake -S external/linphone-sdk -B build-ios --preset ios-sdk \
            -DLINPHONESDK_IOS_PLATFORM=Simulator \
            -DLINPHONESDK_IOS_ARCHS=arm64 \
            -DENABLE_WARNINGS_AS_ERRORS=OFF

      - name: Build SDK
        run: cmake --build build-ios --target sdk --parallel "$(sysctl -n hw.ncpu)"

      - name: Collect artifact
        run: |
          set -e
          mkdir -p dist
          found=0
          while IFS= read -r -d '' f; do
            cp "$f" "dist/$(basename "$f")"
            found=1
          done < <(find build-ios \( -name 'linphone-sdk*.zip' -o -name '*.xcframework' \) -print0 2>/dev/null)
          if [ "$found" -eq 0 ]; then echo "SDK output not found"; find build-ios -maxdepth 3 -type f | head -50; exit 1; fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: sufficit-phone-ios-sdk-simulator
          path: dist/*
          if-no-files-found: error
