name: Build Linux (AppImage)

on:
  push:
    branches: [main]
    paths: ['Linphone/**', 'cmake/**', 'external/**', 'CMakeLists.txt', '.github/workflows/build-linux.yml']
  pull_request:
    paths: ['Linphone/**', 'cmake/**', 'external/**', 'CMakeLists.txt', '.github/workflows/build-linux.yml']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_BREAK_SYSTEM_PACKAGES: '1'

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Restore submodules (offline bundle)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          key="${{ vars.SUBMODS_BUNDLE_KEY }}"
          sha="${{ vars.SUBMODS_BUNDLE_SHA256 }}"
          if [ -z "$key" ] || [ -z "$sha" ]; then
            echo "SUBMODS_BUNDLE_KEY/SUBMODS_BUNDLE_SHA256 não definidas (veja .github/workflows/README.md)."
            exit 1
          fi
          tag="submods-${key:0:8}"
          echo "Baixando bundle $tag..."
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "submodules-${key}.tar.gz" --output /tmp/submodules.tar.gz
          echo "$sha  /tmp/submodules.tar.gz" | sha256sum -c -
          tar -xzf /tmp/submodules.tar.gz
          test -f external/linphone-sdk/CMakeLists.txt
          echo "Submódulos restaurados (offline)."

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build libssl-dev libxml2-dev libsqlite3-dev \
            bison flex yasm nasm python3-pip pkg-config \
            doxygen graphviz meson \
            libudev-dev libasound2-dev libpulse-dev libv4l-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev \
            libx11-dev libxext-dev libxrandr-dev libgl1-mesa-dev libgtk-3-dev \
            libglew-dev libxcb-cursor0 \
            libldap-dev \
            libsecret-1-dev \
            zlib1g-dev libbz2-dev libreadline-dev libncurses-dev libspeex-dev libspeexdsp-dev \
            autoconf automake libtool intltool
          python3 -m pip install --user pystache cython pdoc six

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtmultimedia qtnetworkauth qtshadertools'
          cache: true

      # install-qt-action can change PATH to its Python; install into the interpreter CMake will find.
      - name: Ensure CMake Python modules
        run: |
          python3 -m pip install --user pystache cython pdoc six
          python3 -c 'import pystache, six; print("Python modules OK:", pystache.__file__)'

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux
          max-size: 2G

      - name: Compute versions
        run: |
          APP_VERSION=$(bash .github/scripts/app-version.sh)
          SDK_VERSION=$(git -C external/linphone-sdk describe --tags --long --match '[0-9]*' 2>/dev/null || bash .github/scripts/app-version.sh)
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--allow-shlib-undefined" \
            -DENABLE_APP_PACKAGING=ON \
            -DLINPHONEAPP_VERSION="$APP_VERSION" \
            -DLINPHONESDK_VERSION="$SDK_VERSION"

      - name: Build and package
        run: cmake --build build --target install --parallel "$(nproc)"

      - name: Collect artifact
        run: |
          set -e
          mkdir -p dist
          f=$(find build/OUTPUT/Packages -name '*.AppImage' | head -n1)
          if [ -z "$f" ]; then echo "AppImage not found"; find build/OUTPUT -maxdepth 3 -type f | head -50; exit 1; fi
          cp "$f" "dist/sufficit-phone-x86_64.AppImage"
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: sufficit-phone-linux
          path: dist/*
          if-no-files-found: error
