# Builds and publishes every client asset for a version tag.
# Desktop jobs produce native installers; Android/iOS jobs currently produce
# SDK packages because this repository does not contain mobile app projects.
name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    uses: ./.github/workflows/build-linux.yml
  windows:
    uses: ./.github/workflows/build-windows.yml
  macos:
    uses: ./.github/workflows/build-macos.yml
  android:
    uses: ./.github/workflows/build-android.yml
  ios:
    uses: ./.github/workflows/build-ios.yml

  publish:
    needs: [linux, windows, macos, android, ios]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out packaging scripts
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sufficit-phone-*
          path: downloaded
          merge-multiple: false

      - name: Install Linux package builders
        run: sudo apt-get update && sudo apt-get install -y rpm squashfs-tools

      - name: Assemble release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob

          # Flatten each artifact while preserving duplicate names and turning
          # xcframework directories into downloadable archives.
          for artifact_dir in downloaded/sufficit-phone-*; do
            [ -d "$artifact_dir" ] || continue
            artifact=${artifact_dir##*/}
            # The iOS SDK zip already contains every .xcframework; keep the zip
            # and skip the loose (duplicated) frameworks.
            ios_zip=$(find "$artifact_dir" -maxdepth 1 -type f -name 'linphone-sdk*.zip' -print -quit)
            for item in "$artifact_dir"/*; do
              [ -e "$item" ] || continue
              name=$(basename "$item")
              case "$name" in
                SHA256SUMS|SHA256SUMS.txt) continue ;;
              esac
              if [ -d "$item" ]; then
                if [ -n "$ios_zip" ] && [ "$artifact" = sufficit-phone-ios-sdk-simulator ]; then
                  continue
                fi
                tar -C "$artifact_dir" -czf "dist/${artifact}-${name}.tar.gz" "$name"
              else
                target="dist/$name"
                if [ -e "$target" ]; then target="dist/${artifact}-${name}"; fi
                cp -a "$item" "$target"
              fi
            done
          done

          # Drop byte-identical duplicates, keeping the shortest file name.
          python3 - <<'PY'
          import hashlib, os
          dist = 'dist'
          by_hash = {}
          for name in sorted(os.listdir(dist)):
              path = os.path.join(dist, name)
              if not os.path.isfile(path):
                  continue
              digest = hashlib.sha256()
              with open(path, 'rb') as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b''):
                      digest.update(chunk)
              by_hash.setdefault(digest.hexdigest(), []).append(name)
          for names in by_hash.values():
              if len(names) > 1:
                  keep = max(names, key=len)
                  for name in names:
                      if name != keep:
                          os.remove(os.path.join(dist, name))
                          print(f'removed duplicate {name} (== {keep})')
          PY

          appimage=$(find downloaded/sufficit-phone-linux -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          version="${RELEASE_TAG#v}"
          .github/scripts/package-linux-from-appimage.sh "$appimage" dist "$version"

          (cd dist && sha256sum -- $(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | sort) > SHA256SUMS.new && mv SHA256SUMS.new SHA256SUMS)
          echo '=== release assets ==='
          find dist -maxdepth 1 -type f -printf '%f\t%k KB\n' | sort

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<'NOTES'
          ## Sufficit Phone @TAG@

          Downloads for all client platforms generated from the same release tag.

          ### Desktop clients
          - Windows: NSIS installer (x64)
          - macOS: DMG (unsigned; use **Open** on first launch if required)
          - Linux: AppImage, Debian .deb, RPM .rpm and portable .tar.gz (x86_64)

          ### Mobile packages
          - Android: Linphone SDK AAR/ZIP packages (the repository currently has no Android app UI/APK project)
          - iOS: simulator SDK ZIP (the repository currently has no signed iOS app/IPA project)

          SHA-256 checksums for every asset are included in the SHA256SUMS file.
          NOTES
          sed -i "s/@TAG@/${tag}/g" "$notes"

          if [[ "$tag" == *-* ]]; then
            pre=(--prerelease)
          else
            pre=()
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" "${pre[@]}" dist/* \
              --title "Sufficit Phone $tag" \
              --verify-tag \
              --notes-file "$notes" \
              --generate-notes
          fi
          gh release view "$tag" --json tagName,isPrerelease,assets --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[].name]}'
