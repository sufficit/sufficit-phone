# Creates a GitHub Release with the desktop installers when a version tag
# (e.g. 6.2.0, 6.2.0-beta or v6.2.0) is pushed. Tag the tip of main —
# the build derives LINPHONEAPP_VERSION from `git describe`.
# Tags with a pre-release suffix (-alpha/-beta/-rc) are published as prerelease.
name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*-*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-linux.yml
  windows:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-windows.yml
  macos:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-macos.yml

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sufficit-phone-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            *-*) pre=(--prerelease) ;;
            *) pre=() ;;
          esac
          ls -la dist
          gh release create "$tag" "${pre[@]}" dist/* \
            --title "Sufficit Phone $tag" \
            --verify-tag \
            --generate-notes \
            --notes "Instaladores do Sufficit Phone $tag.

          - Linux: AppImage (x86_64)
          - Windows: instalador NSIS (x64)
          - macOS: imagem de disco (não assinada; use botão direito > Abrir no primeiro acesso)

          Verifique a integridade com os arquivos SHA256SUMS." \
            || gh release upload "$tag" dist/* --clobber
          gh release view "$tag" --json assets --jq '.assets[].name'
